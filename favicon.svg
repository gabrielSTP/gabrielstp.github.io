<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect x="0" y="0" width="200" height="200" rx="40" ry="40" fill="url(#bgGradient)"/>
  
  <!-- Code brackets styling -->
  <g fill="none" stroke="url(#textGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket -->
    <path d="M 70 50 L 50 100 L 70 150" />
    <!-- Right bracket -->
    <path d="M 130 50 L 150 100 L 130 150" />
  </g>
  
  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" fill="url(#textGradient)"/>
</svg>